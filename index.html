<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Portable de Carta Digital - Dossier Interactivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1922;
      color: #a8e6cf;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #0b1922;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 12px;
      padding: 20px;
      text-align: center;
    }
    .book-wrapper {
      width: 95vw;
      max-width: 1400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    button {
      background: #162b38;
      color: #7ef29d;
      border: 1px solid #7ef29d;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover {
      background: #7ef29d;
      color: #0b1922;
    }
  </style>
</head>
<body>

  <div id="loader">
    <p id="statusTitle">Cargando dossier interactivo...</p>
    <span id="progress">Preparando páginas...</span>
  </div>

  <div class="book-wrapper">
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">← Anterior</button>
    <span id="pageInfo">Página 1 de 30</span>
    <button id="nextBtn">Siguiente →</button>
  </div>

  <script src="./page-flip.browser.js"></script>

  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

    const pdfUrl = './dossier-editor-portable-carta-digital.pdf';
    const flipbookEl = document.getElementById('flipbook');
    const loader = document.getElementById('loader');
    const statusTitle = document.getElementById('statusTitle');
    const progressText = document.getElementById('progress');
    const pageInfo = document.getElementById('pageInfo');

    async function initBook() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          wasmUrl: './wasm/'
        });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        for (let num = 1; num <= totalPages; num++) {
          progressText.textContent = `Renderizando ${num} / ${totalPages} páginas`;
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: 1.6 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          if (num === 1 || num === totalPages) {
            pageDiv.dataset.density = 'hard';
          }

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          pageDiv.appendChild(canvas);
          flipbookEl.appendChild(pageDiv);
        }

        const pageFlip = new St.PageFlip(flipbookEl, {
          width: 640,
          height: 360,
          size: 'stretch',
          minWidth: 320,
          maxWidth: 1280,
          minHeight: 180,
          maxHeight: 720,
          showCover: true,
          maxShadowOpacity: 0.4,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
          if (e.key === 'ArrowRight') pageFlip.flipNext();
        });

        pageFlip.on('flip', (e) => {
          pageInfo.textContent = `Página ${e.data + 1} de ${totalPages}`;
        });

        loader.style.display = 'none';
      } catch (err) {
        statusTitle.textContent = 'Error al cargar el documento';
        progressText.textContent = err.message;
        console.error(err);
      }
    }

    initBook();
  </script>
</body>
</html>
