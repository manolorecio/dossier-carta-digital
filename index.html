<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Portable de Carta Digital - Dossier Interactivo</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1922;
      color: #a8e6cf;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #0b1922;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 12px;
      padding: 20px;
      text-align: center;
    }
    .viewport-area {
      width: 100vw;
      height: calc(100vh - 64px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 16px;
      perspective: 2000px;
    }
    .viewport-area.zoomed {
      align-items: flex-start;
      justify-content: flex-start;
    }
    .slide-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
    }
    .slide-page {
      display: none;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
      border-radius: 4px;
      overflow: hidden;
    }
    .slide-page.active {
      display: block;
      animation: pageEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide-page.active.prev-anim {
      animation: pageEnterPrev 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide-page canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 95vw;
      max-height: calc(100vh - 96px);
      aspect-ratio: attr(width) / attr(height);
      object-fit: contain;
    }
    .viewport-area.zoomed .slide-page canvas {
      max-width: none;
      max-height: none;
      width: 165vw;
      height: auto;
      cursor: grab;
    }
    @keyframes pageEnter {
      from { opacity: 0.4; transform: rotateY(-12deg) translateX(25px); }
      to { opacity: 1; transform: rotateY(0deg) translateX(0); }
    }
    @keyframes pageEnterPrev {
      from { opacity: 0.4; transform: rotateY(12deg) translateX(-25px); }
      to { opacity: 1; transform: rotateY(0deg) translateX(0); }
    }
    .controls {
      height: 64px;
      width: 100%;
      background: #081219;
      border-top: 1px solid #162b38;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 0 10px;
    }
    button {
      background: #162b38;
      color: #7ef29d;
      border: 1px solid #7ef29d;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover:not(:disabled), button.active {
      background: #7ef29d;
      color: #0b1922;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #pageInfo {
      font-size: 14px;
      min-width: 125px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="loader">
    <p id="statusTitle">Cargando dossier en alta definición...</p>
    <span id="progress">Preparando páginas...</span>
  </div>

  <div class="viewport-area" id="viewportArea">
    <div class="slide-container" id="slideContainer"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">← Anterior</button>
    <span id="pageInfo">Página 1 de 30</span>
    <button id="nextBtn">Siguiente →</button>
    <button id="zoomBtn">🔍 Ampliar</button>
    <button id="fullBtn">⛶ Pantalla completa</button>
  </div>

  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

    const pdfUrl = './dossier-editor-portable-carta-digital.pdf';
    const slideContainer = document.getElementById('slideContainer');
    const viewportArea = document.getElementById('viewportArea');
    const loader = document.getElementById('loader');
    const statusTitle = document.getElementById('statusTitle');
    const progressText = document.getElementById('progress');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const fullBtn = document.getElementById('fullBtn');

    let currentIndex = 0;
    let totalSinglePages = 0;
    const slides = [];

    function addHalfSlide(sourceCanvas, half) {
      const halfWidth = Math.floor(sourceCanvas.width / 2);
      const height = sourceCanvas.height;
      const sx = half === 'left' ? 0 : halfWidth;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'slide-page';

      const canvas = document.createElement('canvas');
      canvas.width = halfWidth;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceCanvas, sx, 0, halfWidth, height, 0, 0, halfWidth, height);

      pageDiv.appendChild(canvas);
      slideContainer.appendChild(pageDiv);
      slides.push(pageDiv);
    }

    function showPage(index, direction = 'next') {
      if (index < 0 || index >= totalSinglePages) return;
      slides.forEach((s) => s.classList.remove('active', 'prev-anim'));
      const target = slides[index];
      if (direction === 'prev') target.classList.add('prev-anim');
      target.classList.add('active');
      currentIndex = index;

      pageInfo.textContent = `Página ${currentIndex + 1} de ${totalSinglePages}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === totalSinglePages - 1;
      viewportArea.scrollTo({ top: 0, left: 0 });
    }

    async function initBook() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          wasmUrl: './wasm/'
        });
        const pdf = await loadingTask.promise;
        const rawPages = pdf.numPages;

        for (let num = 1; num <= rawPages; num++) {
          progressText.textContent = `Renderizando HD: ${num} / ${rawPages} páginas`;
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: 2.5 });

          const tempCanvas = document.createElement('canvas');
          const tempContext = tempCanvas.getContext('2d');
          tempCanvas.height = viewport.height;
          tempCanvas.width = viewport.width;

          await page.render({ canvasContext: tempContext, viewport: viewport }).promise;

          // Solo divide si es un pliego doble ultraancho (32:9), nunca una diapositiva 16:9
          if (viewport.width > viewport.height * 2.6) {
            addHalfSlide(tempCanvas, 'left');
            addHalfSlide(tempCanvas, 'right');
          } else {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'slide-page';
            pageDiv.appendChild(tempCanvas);
            slideContainer.appendChild(pageDiv);
            slides.push(pageDiv);
          }
        }

        totalSinglePages = slides.length;
        showPage(0);

        prevBtn.addEventListener('click', () => showPage(currentIndex - 1, 'prev'));
        nextBtn.addEventListener('click', () => showPage(currentIndex + 1, 'next'));

        slideContainer.addEventListener('click', (e) => {
          if (viewportArea.classList.contains('zoomed')) return;
          const rect = slideContainer.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          if (clickX > rect.width * 0.5) {
            showPage(currentIndex + 1, 'next');
          } else {
            showPage(currentIndex - 1, 'prev');
          }
        });

        let isZoomed = false;
        zoomBtn.addEventListener('click', () => {
          isZoomed = !isZoomed;
          viewportArea.classList.toggle('zoomed', isZoomed);
          zoomBtn.classList.toggle('active', isZoomed);
          zoomBtn.textContent = isZoomed ? '🔍 Ajustar' : '🔍 Ampliar';
          viewportArea.scrollTo({ top: 0, left: 0 });
        });

        fullBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') showPage(currentIndex - 1, 'prev');
          if (e.key === 'ArrowRight' || e.key === ' ') showPage(currentIndex + 1, 'next');
        });

        loader.style.display = 'none';
      } catch (err) {
        statusTitle.textContent = 'Error al cargar el documento';
        progressText.textContent = err.message;
        console.error(err);
      }
    }

    initBook();
  </script>
</body>
</html>
