<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Portable de Carta Digital - Dossier Interactivo</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1922;
      color: #a8e6cf;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #0b1922;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 12px;
      padding: 20px;
      text-align: center;
    }
    .viewport-area {
      width: 100vw;
      height: calc(100vh - 64px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 12px;
    }
    .viewport-area.zoomed {
      align-items: flex-start;
      justify-content: flex-start;
    }
    .book-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
      transition: transform 0.25s ease;
      transform-origin: top left;
    }
    .viewport-area.zoomed .book-wrapper {
      transform: scale(1.65);
    }
    .page {
      background-color: #ffffff;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }
    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .controls {
      height: 64px;
      width: 100%;
      background: #081219;
      border-top: 1px solid #162b38;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 0 10px;
    }
    button {
      background: #162b38;
      color: #7ef29d;
      border: 1px solid #7ef29d;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover:not(:disabled), button.active {
      background: #7ef29d;
      color: #0b1922;
    }
    #pageInfo {
      font-size: 14px;
      min-width: 125px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="loader">
    <p id="statusTitle">Cargando dossier en alta definición...</p>
    <span id="progress">Preparando páginas...</span>
  </div>

  <div class="viewport-area" id="viewportArea">
    <div class="book-wrapper" id="bookWrapper">
      <div id="flipbook"></div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">← Anterior</button>
    <span id="pageInfo">Página 1 de 30</span>
    <button id="nextBtn">Siguiente →</button>
    <button id="zoomBtn">🔍 Ampliar</button>
    <button id="fullBtn">⛶ Pantalla completa</button>
  </div>

  <script src="./page-flip.browser.js"></script>

  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

    const pdfUrl = './dossier-editor-portable-carta-digital.pdf';
    const flipbookEl = document.getElementById('flipbook');
    const viewportArea = document.getElementById('viewportArea');
    const loader = document.getElementById('loader');
    const statusTitle = document.getElementById('statusTitle');
    const progressText = document.getElementById('progress');
    const pageInfo = document.getElementById('pageInfo');
    const zoomBtn = document.getElementById('zoomBtn');
    const fullBtn = document.getElementById('fullBtn');

    // Calcula las dimensiones exactas 16:9 que caben en la pantalla actual
    function getSingleSlideDimensions(aspectRatio) {
      const availW = window.innerWidth * 0.94;
      const availH = (window.innerHeight - 64) * 0.94;
      let width = availW;
      let height = width / aspectRatio;

      if (height > availH) {
        height = availH;
        width = height * aspectRatio;
      }
      return { width: Math.floor(width), height: Math.floor(height) };
    }

    async function initBook() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          wasmUrl: './wasm/'
        });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        let slideRatio = 16 / 9;

        for (let num = 1; num <= totalPages; num++) {
          progressText.textContent = `Renderizando HD: ${num} / ${totalPages} páginas`;
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: 2.5 });

          if (num === 1) {
            slideRatio = viewport.width / viewport.height;
          }

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          pageDiv.appendChild(canvas);
          flipbookEl.appendChild(pageDiv);
        }

        const dims = getSingleSlideDimensions(slideRatio);

        // size: 'fixed' con dimensiones exactas fuerza a StPageFlip a mostrar 1 sola hoja 16:9 con efecto flip
        const pageFlip = new St.PageFlip(flipbookEl, {
          width: dims.width,
          height: dims.height,
          size: 'fixed',
          usePortrait: true,
          showCover: false,
          maxShadowOpacity: 0.45,
          flippingTime: 650,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());

        let isZoomed = false;
        zoomBtn.addEventListener('click', () => {
          isZoomed = !isZoomed;
          viewportArea.classList.toggle('zoomed', isZoomed);
          zoomBtn.classList.toggle('active', isZoomed);
          zoomBtn.textContent = isZoomed ? '🔍 Ajustar' : '🔍 Ampliar';
          viewportArea.scrollTo({ top: 0, left: 0 });
        });

        fullBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
          if (e.key === 'ArrowRight' || e.key === ' ') pageFlip.flipNext();
        });

        pageFlip.on('flip', (e) => {
          pageInfo.textContent = `Página ${e.data + 1} de ${totalPages}`;
        });

        loader.style.display = 'none';
      } catch (err) {
        statusTitle.textContent = 'Error al cargar el documento';
        progressText.textContent = err.message;
        console.error(err);
      }
    }

    initBook();
  </script>
</body>
</html>
